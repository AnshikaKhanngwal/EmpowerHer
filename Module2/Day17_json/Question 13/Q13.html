<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
</head>
<body>
    <h2>Simple Notes App</h2>

    <textarea id="noteArea" rows="10" cols="40" placeholder="Write your notes here..."></textarea>
    <br><br>

    <button onclick="saveNotes()">Save Notes</button>
    <button onclick="loadNotes()">Load Notes</button>
    <button onclick="clearNotes()">Clear Notes</button>

    <script>

        window.onload = function() {
            loadNotes();
        };

     
        function saveNotes() {
            let notes = document.getElementById("noteArea").value;

            if (notes.trim() === "") {
                alert("Cannot save empty notes!");
                return;
            }

            localStorage.setItem("userNotes", notes);
            alert("Notes saved!");
        }

      
        function loadNotes() {
            let savedNotes = localStorage.getItem("userNotes");

            if (savedNotes) {
                document.getElementById("noteArea").value = savedNotes;
            }
        }

        
        function clearNotes() {
            localStorage.removeItem("userNotes");
            document.getElementById("noteArea").value = "";
            alert("Notes cleared!");
        }

    </script>
</body>
</html>
