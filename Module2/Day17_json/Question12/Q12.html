<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="addpara()">Add Paragraph</button>
    <button onclick="removepara()">Remove Last Paragraph</button>
     <div id="content"></div>
</body>
<script>
function addpara(){
 const  contentdiv= document.getElementById("content");
 const newpara=document.createElement("p")
 newpara.textContent="This is a new paragraph.";

 contentdiv.appendChild(newpara)

}

function removepara(){
    const contentdiv=document.getElementById("content");
    const lastpara=contentdiv.lastElementChild;

    if(lastpara){
        contentdiv.removeChild(lastpara);
    }
}

</script>
</html>
