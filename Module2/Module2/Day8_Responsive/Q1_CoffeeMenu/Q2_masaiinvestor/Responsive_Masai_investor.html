    <style>
       
        .container{
            width:90%;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            margin: 20px;
            justify-content: space-evenly;

        }
        .container>div{
            width: auto;
           /* height: auto;
            border: 5px solid blue;*/
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            padding: 5px;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            
        }
        .container>div>div:first-child{
            width: 100%;
            height: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            align-content: center;
           
        }
         .container>div>div:nth-child(2){
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
         }
         .container>div>div:nth-child(2)>h3,.container>div>div:nth-child(2)>h4{
            margin: 3px;
            font-family: sans-serif;

         }
         .container>div>div:nth-child(2)>h4{
            color: rgb(138, 135, 135);
            font-weight: 200;
         }
         .container>div>div:last-child>img{
            width: 60%;
          }
           .container>div>div:last-child{
            display: flex;
            justify-content: center;
           }
        
         @media (max-width: 768px){
        .container{
            grid-template-columns: repeat(3,1fr);
        }
    }

     @media (max-width: 480px){
        .container{
            grid-template-columns: repeat(2,1fr);
        }
       }
      
            
    </style>
</head>
