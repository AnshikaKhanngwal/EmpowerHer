<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="Div1" style="width: 100px;height: 100px;border: 1px solid black;">Hii</div>
    <input type="text" id="color" placeholder="Enter Color Name">
    <input type="text" id="text" placeholder="Enter Text Content">
    <button onclick="changeColor()">Change BgColor</button>
    <button onclick="updateText()">Update Text</button>
    
</body>
<script>
    function changeColor(){
        const division=document.getElementById("Div1");
        const divcolor=document.getElementById("color").value;
      
       if(divcolor===""){
        alert("Invalid color name!");
        return;  
       }
        division.style.backgroundColor=divcolor;
    }

    function updateText(){
        const division=document.getElementById("Div1");
        const updatetext=document.getElementById("text").value;

        if(updatetext===""){
            alert("Please enter some text!.");
            return;
        }

        division.textContent=updatetext;
    }
</script>
</html>
