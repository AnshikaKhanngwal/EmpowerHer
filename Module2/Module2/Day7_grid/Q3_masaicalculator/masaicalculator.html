<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            margin:auto;
            gap: 10px;
           
        }
        .parent>div{
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
             border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .parent>div:first-child{
           grid-column: 1/-1;
           background-color: white;
        }
        .parent>div:nth-child(14){
            background-color: red;
            color: white;
        }
        
        .parent>div:nth-child(16){
            background-color: black;
            color: white;
        }
         .parent>div:nth-child(4n+1){
            background-color: black;
            color: white;
         }
         .parent>div:first-child{
           grid-column: 1/-1;
           background-color: white;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div></div>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>+</div>

        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>-</div>

        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>x</div>

        <div>c</div>
        <div>0</div>
        <div>=</div>
        <div>/</div>
    </div>
</body>
</html>
