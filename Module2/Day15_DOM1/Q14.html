<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debugging Task</title>
</head>
<body>
  <p id="message">Original Message</p>
  <button id="textButton" onclick="textchange()">Change Text</button>

  <br><br>

  <div id="box" style="width: 100px; height: 100px; background-color: lightgray;"></div>
  <button id="colorButton" onclick="colorchange()">Change Background</button>

  <script>
    function textchange(){
        
        const msg= document.getElementById("message");
            msg.textContent= "New Message";

    }

    function colorchange(){

        const bg=document.getElementById("box");
        bg.style.backgroundColor="blue"
    }
  
  </script>
</body>
</html>
